<!doctype html>
<!-- .pre-boot pauses entrance animations until the preloader lifts (removed in JS). -->
<html lang="en" class="pre-boot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0D" />
    <meta name="color-scheme" content="dark" />

    <title>STONES — Rock remembers what time forgot</title>
    <meta
      name="description"
      content="STONES is a cinematic expedition through rock, strata and deep time — from the living surface to the molten origin of Earth."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STONES — Rock remembers what time forgot" />
    <meta
      property="og:description"
      content="Descend through geological eras, mineral archives and field routes in a cinematic experience of deep time."
    />

    <!-- Fonts: preconnect + display=swap so text (LCP) never blocks on font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
